name: Picnic

options:
  bundleIdPrefix: com.oliverullman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Shuffle:
    url: https://github.com/mac-gallagher/Shuffle.git
    from: 0.5.0

settings:
  base:
    DEVELOPMENT_TEAM: J66WVM2DTX
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Picnic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Picnic
    info:
      path: Picnic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Picnic
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Picnic reads your camera roll so you can swipe-sort it month by month."
        NSPhotoLibraryAddUsageDescription: "Picnic needs permission to delete and favorite photos you sort."
        # The mirror server is reached over cleartext HTTP at the host baked
        # in from the PICNIC_MIRROR_HOST CI secret — ATS blocks cleartext by
        # default, which silently killed every mirror POST until 2026-09-01
        # (the queue file had been 0 bytes since the server was stood up).
        # The baked host is a Tailscale MagicDNS name (verified: the shipped
        # IPA's binary contains a *.ts.net string and neither placeholder),
        # so an NSExceptionDomains entry could in principle scope this more
        # tightly. It is deliberately not used: the host is a build-time
        # secret, so naming it here would publish it in this public repo, and
        # a mismatch between the secret and a hardcoded exception domain
        # would fail exactly as silently as the bug this replaced. This is an
        # ad-hoc personal build, never App Store, so arbitrary loads is the
        # right trade. Note the POST also needs the phone on Tailscale with
        # MagicDNS enabled for that hostname to resolve at all.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic
        PRODUCT_NAME: Picnic
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Shuffle
    scheme:
      testTargets:
        - PicnicUITests
        - WalkthroughUITests
      gatherCoverageData: false

  PicnicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PicnicUITests
    dependencies:
      - target: Picnic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic.uitests
        CODE_SIGN_STYLE: Automatic

  WalkthroughUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WalkthroughUITests
    dependencies:
      - target: Picnic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic.walkthroughtests
        CODE_SIGN_STYLE: Automatic
