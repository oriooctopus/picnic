name: Picnic

options:
  bundleIdPrefix: com.oliverullman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: J66WVM2DTX
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Picnic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Picnic
    info:
      path: Picnic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Picnic
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Picnic reads your camera roll so you can swipe-sort it month by month."
        NSPhotoLibraryAddUsageDescription: "Picnic needs permission to delete and favorite photos you sort."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic
        PRODUCT_NAME: Picnic
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - PicnicUITests
      gatherCoverageData: false

  PicnicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PicnicUITests
    dependencies:
      - target: Picnic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic.uitests
        CODE_SIGN_STYLE: Automatic
