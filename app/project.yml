name: Picnic

options:
  bundleIdPrefix: com.oliverullman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Shuffle:
    url: https://github.com/mac-gallagher/Shuffle.git
    from: 0.5.0

settings:
  base:
    DEVELOPMENT_TEAM: J66WVM2DTX
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Picnic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Picnic
    info:
      path: Picnic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Picnic
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Picnic reads your camera roll so you can swipe-sort it month by month."
        NSPhotoLibraryAddUsageDescription: "Picnic needs permission to delete and favorite photos you sort."
        # The mirror server is reached over cleartext HTTP at a Tailscale IP
        # baked in from a CI secret (PICNIC_MIRROR_HOST) — ATS blocks that by
        # default. Use NSAllowsArbitraryLoads rather than an
        # NSExceptionDomains entry: exception domains are for hostnames, and
        # do not reliably cover bare IP literals like a Tailscale address.
        # This is an ad-hoc personal build, never App Store, so arbitrary
        # loads is acceptable — do NOT "tighten" this to exception domains,
        # it will silently re-break the mirror POST.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic
        PRODUCT_NAME: Picnic
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Shuffle
    scheme:
      testTargets:
        - PicnicUITests
        - WalkthroughUITests
      gatherCoverageData: false

  PicnicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PicnicUITests
    dependencies:
      - target: Picnic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic.uitests
        CODE_SIGN_STYLE: Automatic

  WalkthroughUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WalkthroughUITests
    dependencies:
      - target: Picnic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverullman.picnic.walkthroughtests
        CODE_SIGN_STYLE: Automatic
