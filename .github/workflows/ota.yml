name: ota

# Builds an ad-hoc signed ipa for over-the-air install, following the same
# pattern as Overland-iOS's ota.yml: same cert secrets, same fastlane `adhoc`
# lane shape, same bake-a-secret-into-a-checked-in-placeholder step. The
# resulting ota-ipa artifact is picked up by an ota-install poller instance
# (see README.md — that poller needs a parallel Picnic instance set up
# outside this repo; it does not exist yet).
on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - ".github/workflows/sim-test.yml"
      - ".github/workflows/visual-walk.yml"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd app
          xcodegen generate

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Bake the mirror token into the app
        env:
          PICNIC_MIRROR_TOKEN: ${{ secrets.PICNIC_MIRROR_TOKEN }}
          PICNIC_MIRROR_HOST: ${{ secrets.PICNIC_MIRROR_HOST }}
        run: |
          set -euo pipefail
          test -n "$PICNIC_MIRROR_TOKEN" || { echo "PICNIC_MIRROR_TOKEN secret is empty/missing"; exit 1; }
          test -n "$PICNIC_MIRROR_HOST" || { echo "PICNIC_MIRROR_HOST secret is empty/missing"; exit 1; }
          {
            echo '// Generated by CI — do not commit the result.'
            echo 'enum MirrorToken {'
            echo "    static let value = \"$PICNIC_MIRROR_TOKEN\""
            echo "    static let host = \"$PICNIC_MIRROR_HOST\""
            echo '}'
          } > app/Picnic/App/MirrorToken.swift
          echo "MirrorToken.swift written ($(wc -l < app/Picnic/App/MirrorToken.swift) lines)"

          # Guard: a build that silently kept the placeholder would ship an
          # app that 401s the mirror server forever.
          grep -q NO_TOKEN_BAKED_IN app/Picnic/App/MirrorToken.swift \
            && { echo "placeholder survived the bake"; exit 1; } || true

      - name: Build ad-hoc ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cd app
          fastlane adhoc

      # The poller expects exactly one ipa inside the artifact.
      - name: Locate the ipa
        run: |
          set -eo pipefail
          shopt -s nullglob
          IPAS=(app/build/adhoc/*.ipa)
          test ${#IPAS[@]} -eq 1 || { echo "expected exactly 1 ipa in app/build/adhoc, found ${#IPAS[@]}: ${IPAS[*]}"; exit 1; }
          echo "IPA_PATH=${IPAS[0]}" >> "$GITHUB_ENV"
          echo "Found ${IPAS[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ota-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 5
          if-no-files-found: error
