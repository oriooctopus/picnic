name: visual-walk

# Full-UI visual walkthrough: seeds a real photo library via PhotoKit (no
# mocking), then runs WalkthroughUITests to capture a named screenshot of
# every screen/interaction state in SPEC.md's reference set. Dispatch-only —
# this is an expensive, deliberate run, not something that should fire on
# every push.
on:
  workflow_dispatch:
    inputs:
      only_testing:
        description: 'Comma-separated WalkthroughUITests method names to run (blank = full suite)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-walk:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.oliverullman.picnic
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd app
          xcodegen generate

      # Reference screenshots are 1170x2532 (iPhone 14 class: iPhone 12/12
      # Pro, 13/13 Pro, and 14 all share this panel). Runner images don't
      # reliably pre-instantiate older device names, so create the device
      # explicitly by stable type identifier instead of grep'ing pre-existing
      # devices, falling back down the same-resolution family if a given
      # device type isn't supported by the installed SDK.
      - name: "Choose + create simulator (target: iPhone 14 class, 1170x2532)"
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "Using runtime: $RUNTIME_ID"

          CHOSEN=""
          UDID=""
          for DT in \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-14:iPhone 14" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-13-Pro:iPhone 13 Pro" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-13:iPhone 13" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-12-Pro:iPhone 12 Pro" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-12:iPhone 12"; do
            TYPE_ID="${DT%%:*}"
            NAME="${DT##*:}"
            if xcrun simctl list devicetypes | grep -q "$TYPE_ID"; then
              if CANDIDATE_UDID=$(xcrun simctl create "picnic-walkthrough" "$TYPE_ID" "$RUNTIME_ID" 2>/tmp/create.err); then
                CHOSEN="$NAME"
                UDID="$CANDIDATE_UDID"
                break
              else
                echo "Could not create $NAME: $(cat /tmp/create.err)"
              fi
            fi
          done

          test -n "$CHOSEN" || { echo "No 1170x2532-class device type available on this runner"; exit 1; }
          echo "Chosen simulator: $CHOSEN ($UDID) — this is the reference-resolution match, recorded for the run report."
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIM_NAME=$CHOSEN" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build once (app + WalkthroughUITests)
        run: |
          cd app
          xcodebuild build-for-testing \
            -project Picnic.xcodeproj \
            -scheme Picnic \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO
          echo "APP_PATH=$PWD/$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)" >> "$GITHUB_ENV"

      - name: Install app + grant photo library access
        run: |
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          # photos-add BEFORE photos: granting add-only second can downgrade
          # the full-library grant, which leaves the app stuck behind the
          # "requesting additional access" sheet. The walkthrough also taps
          # "Allow Full Access" itself if the sheet appears anyway.
          # `grant all` is the only spelling that reliably yields FULL
          # (not add-only) library access on a fresh runner simulator;
          # granting the two photo scopes individually intermittently left
          # the app add-only, which reads back as an empty library.
          xcrun simctl privacy "$SIM_UDID" grant all "$BUNDLE_ID"
          xcrun simctl privacy "$SIM_UDID" grant photos-add "$BUNDLE_ID"
          xcrun simctl privacy "$SIM_UDID" grant photos "$BUNDLE_ID"

      # Screen recording of the whole test run. Screenshots prove layout;
      # only video shows whether an interaction is smooth or juddering, which
      # is the actual question for the deck's swipe.
      - name: Start screen recording
        run: |
          nohup xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force \
            "$GITHUB_WORKSPACE/sim-recording.mp4" > /tmp/record.log 2>&1 &
          echo "RECORD_PID=$!" >> "$GITHUB_ENV"
          sleep 3
          echo "recording started (pid $!)"

      - name: Run WalkthroughUITests (reusing derived data from the build step)
        env:
          # Best-effort direct write from the test runner process (which runs
          # on the host, not inside the app's sandbox) — see WalkthroughUITests
          # capture(). The xcresulttool extraction step above is authoritative
          # either way, so this is a bonus, not a dependency.
          WALKTHROUGH_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$WALKTHROUGH_SCREENSHOT_DIR"
          cd app

          ONLY_TESTING_FLAGS=()
          IFS=',' read -ra METHODS <<< "${{ github.event.inputs.only_testing }}"
          if [ -n "${{ github.event.inputs.only_testing }}" ]; then
            for m in "${METHODS[@]}"; do
              ONLY_TESTING_FLAGS+=("-only-testing:WalkthroughUITests/WalkthroughUITests/$m")
            done
          else
            ONLY_TESTING_FLAGS+=("-only-testing:WalkthroughUITests")
          fi

          xcodebuild test-without-building \
            -project Picnic.xcodeproj \
            -scheme Picnic \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            "${ONLY_TESTING_FLAGS[@]}" \
            CODE_SIGNING_ALLOWED=NO

      # recordVideo only finalizes the container on SIGINT — killing it any
      # other way leaves an unplayable file.
      - name: Stop screen recording
        if: always()
        run: |
          if [ -n "${RECORD_PID:-}" ]; then kill -INT "$RECORD_PID" 2>/dev/null || true; fi
          for _ in $(seq 1 30); do
            pgrep -f "simctl io .* recordVideo" > /dev/null || break
            sleep 1
          done
          sleep 2
          ls -lh "$GITHUB_WORKSPACE/sim-recording.mp4" || echo "no recording produced"
          cat /tmp/record.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-recording
          path: sim-recording.mp4
          if-no-files-found: warn

      # XCUITest attachments live inside the .xcresult bundle, not as loose
      # files. `xcresulttool get test-results attachments` (first-party,
      # Xcode 16+) exports them plus a manifest.json mapping each exported
      # file back to the XCTAttachment.name we set in WalkthroughUITests
      # (e.g. "01-mylife"). Parse that manifest to produce the flat named
      # PNGs; fall back to substring-matching raw filenames if a given Xcode
      # version doesn't preserve names in the manifest the same way.
      - name: Extract named screenshots from the xcresult
        if: always()
        run: |
          set -euo pipefail
          mkdir -p extracted screenshots

          XCRESULT=$(ls -d app/build/Logs/Test/*.xcresult 2>/dev/null | head -1 || true)
          if [ -z "$XCRESULT" ]; then
            echo "No .xcresult bundle found under app/build/Logs/Test — the test step must not have run."
            exit 1
          fi
          echo "Using xcresult: $XCRESULT"

          # Xcode 16+: `export attachments` (the `get test-results attachments`
          # spelling rejects --path on the runner's xcresulttool).
          xcrun xcresulttool export attachments --path "$XCRESULT" --output-path extracted | tee export-log.txt

          echo "Extracted directory contents:"
          find extracted -maxdepth 3 -type f | sort

          python3 .github/scripts/extract_walkthrough_screenshots.py "$PWD/extracted" "$PWD/screenshots" "$PWD/export-log.txt"

          echo "Final screenshots directory:"
          ls -la screenshots

      # Real assertion for test17DeckFilmstripMixedAspectRatios: XCUITest's
      # accessibility-tree frame.width for these thumbnails stopped tracking
      # real rendered geometry (see the doc comment on that test), so this
      # measures actual pixels in the screenshot it captures instead.
      - name: Check filmstrip thumbnails for overlap (pixel measurement)
        if: always()
        run: |
          SHOT="screenshots/24-deck-filmstrip-mixed-aspect.png"
          if [ ! -f "$SHOT" ]; then
            echo "No $SHOT (likely an only_testing run that excluded test17DeckFilmstripMixedAspectRatios) — skipping."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow
          python3 .github/scripts/check_filmstrip_overlap.py "$SHOT"

      # Real assertion for test30FilmstripThumbnailsRetainImageAfterSwipeUnderHideSorted
      # (D1's actual regression — see check_filmstrip_content.py's doc
      # comment): an element existing in the accessibility tree doesn't mean
      # it's rendering anything, so this measures the real pixels instead.
      - name: Check filmstrip thumbnails retain image content after a hideSorted swipe (pixel measurement)
        if: always()
        run: |
          SHOT="screenshots/29-filmstrip-thumbs-after-hidesorted-swipe.png"
          if [ ! -f "$SHOT" ]; then
            echo "No $SHOT (likely an only_testing run that excluded test30FilmstripThumbnailsRetainImageAfterSwipeUnderHideSorted) — skipping."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow
          python3 .github/scripts/check_filmstrip_content.py "$SHOT"

      # Real assertion for test31FilmstripDropsCountUnderHideSortedAtScale:
      # the position-label total is view-model-driven and would stay correct
      # even if the filmstrip VIEW itself failed to visually update (the
      # owner's actual real-device report). This diffs the real pixels of
      # the filmstrip band between the before/after screenshots that test
      # captures, so a frozen-looking strip fails here even though the
      # in-process count assertions all passed.
      - name: Check filmstrip visually updates after swipes at scale (pixel diff)
        if: always()
        run: |
          BEFORE="screenshots/30-filmstrip-before-scale-swipes.png"
          AFTER="screenshots/31-filmstrip-after-scale-swipes.png"
          if [ ! -f "$BEFORE" ] || [ ! -f "$AFTER" ]; then
            echo "Missing $BEFORE or $AFTER (likely an only_testing run that excluded test31FilmstripDropsCountUnderHideSortedAtScale) — skipping."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow
          python3 .github/scripts/check_filmstrip_visually_updated.py "$BEFORE" "$AFTER"

      # Real assertion for test36DeckCardUpdatesImmediatelyUnderHideSortedWithSlowLoad
      # (the owner's real-device report, reproduced directly against the big
      # card rather than the filmstrip's side effects): --slow-image-loads
      # stands in for the iCloud round trip a simulator can never hit, and
      # this diffs the card's dominant colour between the pre-swipe and
      # immediately-post-swipe screenshots — a frozen card (still showing the
      # swiped-away photo) fails here even though nothing else in this job
      # would catch it.
      - name: Check deck card updates immediately after a hideSorted swipe (pixel measurement)
        if: always()
        run: |
          BEFORE="screenshots/40-deck-card-before-swipe.png"
          AFTER="screenshots/41-deck-card-immediately-after-swipe.png"
          if [ ! -f "$BEFORE" ] || [ ! -f "$AFTER" ]; then
            echo "Missing $BEFORE or $AFTER (likely an only_testing run that excluded test36DeckCardUpdatesImmediatelyUnderHideSortedWithSlowLoad) — skipping."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow
          python3 .github/scripts/check_deck_card_not_frozen.py "$BEFORE" "$AFTER"

      # Real assertion for test38CompareLandscapePhotoIsNotCropped: Compare
      # used to draw its photo with .aspectRatio(contentMode: .fill), which
      # crops a source photo to fill the (roughly portrait) card box instead
      # of shrinking it to fit inside — so a landscape photo came out zoomed
      # in and cut off, unlike the same photo in Deck (.scaleAspectFit). This
      # measures the actual rendered band of November's landscape burst
      # cluster in the "42-compare-landscape-not-cropped" screenshot: its
      # aspect ratio should match .fit (~0.75 for an 800x600 source) with
      # dark letterbox bars above and below, not the box's own taller aspect
      # ratio with no bars at all (what .fill produces).
      - name: Check Compare photo is aspect-fit, not cropped (pixel measurement)
        if: always()
        run: |
          SHOT="screenshots/42-compare-landscape-not-cropped.png"
          if [ ! -f "$SHOT" ]; then
            echo "No $SHOT (likely an only_testing run that excluded test38CompareLandscapePhotoIsNotCropped) — skipping."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow
          python3 .github/scripts/check_compare_letterbox.py "$SHOT"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-walk
          path: screenshots
          if-no-files-found: error

      - name: Upload raw attachments (debug evidence, incl. UI hierarchies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-attachments
          path: |
            extracted
            export-log.txt
          if-no-files-found: ignore
